[package]
name = "refineui-gallery"
description = "RefineUI component gallery and screenshot generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "refineui-gallery"

[[bin]]
name = "refineui-gallery"
path = "src/main.rs"

[[bin]]
name = "refineui-screenshots"
path = "src/bin/screenshots.rs"

[dependencies]
gpui.workspace = true
refineui = { workspace = true, features = ["web-extras", "material"] }
refineui-material.workspace = true
anyhow.workspace = true
png.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
