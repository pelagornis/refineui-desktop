[package]
name = "refineui"
description = "RefineUI Desktop — a desktop-native GPUI design system: foundation, interaction, components, workspace composition, application shell and platform adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
include = ["src/**/*", "assets/**/*", "Cargo.toml", "README.md"]

[features]
default = ["bundled-fonts", "syntax-highlight"]
# Embed Inter (OFL) so text renders identically on every machine.
bundled-fonts = []
# CodeBlock syntax colours (syntect with the pure-Rust fancy-regex engine, no onig).
syntax-highlight = ["dep:syntect"]
# Web-oriented page `container()` kept out of Desktop Core. (Link and
# Carousel are core; Footer and NavigationMenu were removed.)
web-extras = []
# `serde` derives for workspace layout state (persistence).
serde = ["dep:serde", "dep:serde_json"]
# Compile the macOS vibrancy AppKit glue on any host, for `cargo check`
# only (CI on Linux). Never enable it in a build that runs.
typecheck-macos-vibrancy = ["dep:objc"]
# Components on the Material Engine (`refineui-material`): real backdrop blur
# for popovers, tooltips, menus, the dialog scrim, `Surface` and opt-in glass
# buttons / inputs / toasts. Needs the vendored gpui (`[patch.crates-io]`,
# see vendor/gpui); off by default so stock gpui 0.2.2 keeps working.
material = ["dep:refineui-material"]

[dependencies]
gpui.workspace = true
refineui-foundation.workspace = true
refineui-material = { workspace = true, optional = true }
refineui-system-icons.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
raw-window-handle = "0.6"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"], optional = true }
objc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
serde_json = "1"
